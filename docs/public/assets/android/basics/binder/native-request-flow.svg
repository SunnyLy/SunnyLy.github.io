<g id="CT" data-step="5"><rect x="56" y="702" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="72" y="733" class="node-title">5. IPCThreadState::transact()</text><text x="72" y="762" class="detail">writeTransactionData() 写入 mOut</text></g>
<g id="CW" data-step="6"><rect x="56" y="830" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="72" y="861" class="node-title">6. talkWithDriver()</text><text x="72" y="890" class="detail">ioctl(BINDER_WRITE_READ)</text></g>
<g id="KI" data-step="7"><rect x="656" y="190" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="221" class="node-title">7. binder_ioctl()</text><text x="672" y="250" class="detail">分派 BINDER_WRITE_READ</text></g>
<g id="KWR" data-step="8"><rect x="656" y="318" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="349" class="node-title">8. binder_ioctl_write_read()</text><text x="672" y="378" class="detail">处理发送端的 write_buffer</text></g>
<g id="KW" data-step="9"><rect x="656" y="446" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="477" class="node-title">9. binder_thread_write()</text><text x="672" y="506" class="detail">解析 BC_TRANSACTION 命令</text></g>
<g id="KT" data-step="10"><rect x="656" y="574" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="605" class="node-title">10. binder_transaction()</text><text x="672" y="634" class="detail">引用校验、复制数据与转换对象</text></g>
<g id="KQ" data-step="11"><rect x="656" y="702" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="733" class="node-title">11. 事务工作入队</text><text x="672" y="762" class="detail">选择或唤醒接收线程</text></g>
<g id="KR" data-step="12"><rect x="656" y="830" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="672" y="861" class="node-title">12. binder_thread_read()</text><text x="672" y="890" class="detail">接收端 ioctl 的 read 阶段</text></g>
<g id="SW" data-step="13"><rect x="1256" y="190" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="221" class="node-title">13. talkWithDriver()</text><text x="1272" y="250" class="detail">ioctl 返回，命令进入 mIn</text></g>
<g id="SR" data-step="14"><rect x="1256" y="318" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="349" class="node-title">14. getAndExecuteCommand()</text><text x="1272" y="378" class="detail">mIn.readInt32() 读取命令</text></g>
<g id="SC" data-step="15"><rect x="1256" y="446" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="477" class="node-title">15. executeCommand()</text><text x="1272" y="506" class="detail">处理 BR_TRANSACTION</text></g>
<g id="SB" data-step="16"><rect x="1256" y="574" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="605" class="node-title">16. BBinder::transact()</text><text x="1272" y="634" class="detail">调用虚函数 onTransact()</text></g>
<g id="G" data-step="17"><rect x="1256" y="702" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="733" class="node-title">17. JavaBBinder::onTransact()</text><text x="1272" y="762" class="detail">JNI 回调 Java Binder</text></g>
<g id="H" data-step="18"><rect x="1256" y="830" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="861" class="node-title">18. Binder.execTransact()</text><text x="1272" y="890" class="detail">进入 Java 分派</text></g>
<g id="I" data-step="19"><rect x="1256" y="958" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="989" class="node-title">19. Stub.onTransact()</text><text x="1272" y="1018" class="detail">解码参数，调用业务方法</text></g>
<g id="J" data-step="20"><rect x="1256" y="1086" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="1272" y="1117" class="node-title">20. 业务接口实现</text><text x="1272" y="1146" class="detail">执行并按同步协议写 reply</text></g>
<g><rect x="444" y="478" width="176" height="66" rx="9" fill="#ffffff" stroke="#bdd0e8"/><text x="532" y="503" text-anchor="middle" class="link-label">BC_TRANSACTION</text><text x="532" y="529" text-anchor="middle" class="detail">6 → 7 · 提交 ioctl</text></g>
<g><rect x="1044" y="478" width="176" height="66" rx="9" fill="#ffffff" stroke="#bdd0e8"/><text x="1132" y="503" text-anchor="middle" class="link-label">BR_TRANSACTION</text><text x="1132" y="529" text-anchor="middle" class="detail">12 → 13 · ioctl 返回</text></g>
<text x="848" y="813" class="detail">工作队列交接</text>
<text x="40" y="1262" class="subtitle">实线：调用或返回的数据路径；虚线：队列交接。11 → 12 不是 binder_transaction 直接调用 binder_thread_read。</text>
<text x="40" y="1292" class="subtitle">服务端可先进入 ioctl 等待；13 表示读调用返回。编号表示本次请求的处理顺序，不是所有线程的绝对时间线。</text>
</svg>
