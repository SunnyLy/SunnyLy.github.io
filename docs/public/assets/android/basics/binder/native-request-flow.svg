<g id="B" data-step="2"><rect x="56" y="318" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="72" y="349" class="node-title">2. AIDL Stub.Proxy</text><text x="72" y="378" class="detail">编码 Parcel，调用 mRemote.transact</text></g>
<g id="D" data-step="3"><rect x="56" y="446" width="352" height="84" rx="10" fill="#ffffff" stroke="#9fb5d2" stroke-width="1.5"/><text x="72" y="477" class="node-title">3. Java BinderProxy</text><text x="72" y="506" class="detail">transactNative() 经 JNI 进入 Native</text></g>
