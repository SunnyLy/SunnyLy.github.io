<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1330" viewBox="0 0 1664 1330" role="img" aria-labelledby="title desc">
<title id="title">Binder 请求方向：客户端提交、驱动路由与服务端接收</title>
<desc id="desc">20 个有序步骤。客户端 talkWithDriver 的 ioctl 提交到驱动 binder_ioctl；驱动 binder_thread_read 返回 BR_TRANSACTION 到服务端 talkWithDriver，再读取命令并执行 BBinder 分派。跨列折线只连接具体节点，不穿过其他节点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3268b6"/></marker></defs>
<style>text{font-family:Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#172b45}.title{font-size:27px;font-weight:700}.subtitle{font-size:17px;fill:#52657e}.heading{font-size:23px;font-weight:700}.node-title{font-size:19px;font-weight:600}.detail{font-size:17px;fill:#52657e}.edge{fill:none;stroke:#3268b6;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}.queue{stroke-dasharray:7 5}.link-label{font-size:17px;font-weight:600;fill:#245797}</style>
<rect width="1664" height="1330" rx="20" fill="#ffffff"/>
<text x="40" y="45" class="title">Binder 请求：谁提交、谁接管、谁接收</text>
<text x="40" y="77" class="subtitle">Java / libbinder · android-16.0.0_r1 | Binder driver · android16-6.12-2025-06_r1</text>
<g id="CLIENT"><rect x="32" y="108" width="400" height="1110" rx="16" fill="#f7f9fc" stroke="#c7d4e5"/><text x="56" y="145" class="heading">客户端进程</text><text x="56" y="173" class="subtitle">提交者：发起调用的线程</text></g>
<g id="KERNEL"><rect x="632" y="108" width="400" height="1110" rx="16" fill="#f0f6fd" stroke="#c7d4e5"/><text x="656" y="145" class="heading">内核 Binder 驱动</text><text x="656" y="173" class="subtitle">提交、工作队列与接收分阶段执行</text></g>
<g id="SERVER"><rect x="1232" y="108" width="400" height="1110" rx="16" fill="#f7f9fc" stroke="#c7d4e5"/><text x="1256" y="145" class="heading">服务端进程</text><text x="1256" y="173" class="subtitle">接收者：正在读取工作的 Binder 线程</text></g>
