<svg xmlns="http://www.w3.org/2000/svg" width="620" height="810" viewBox="0 0 620 810" role="img" aria-labelledby="title desc">
<title id="title">共享秘密不跨网络，按方向派生工作密钥</title><desc id="desc">客户端和服务端交换公开值，各自保留临时私钥并算出相同共享秘密，分别通过HKDF得到方向一致的工作材料，示意模型不等于完整TLS。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="810" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">交换公开值，各自在本机算出相同秘密</tspan></text><rect x="28" y="70" width="250" height="94" rx="14" class="blue"/><text x="153" y="110.5" class="body" text-anchor="middle"><tspan x="153" dy="0">客户端本机</tspan><tspan x="153" dy="29">临时私钥 a</tspan></text><rect x="342" y="70" width="250" height="94" rx="14" class="blue"/><text x="467" y="110.5" class="body" text-anchor="middle"><tspan x="467" dy="0">服务端本机</tspan><tspan x="467" dy="29">临时私钥 b</tspan></text><path d="M278 205 L342 205" class="arrow" marker-end="url(#a)"/><path d="M342 250 L278 250" class="arrow" marker-end="url(#a)"/><text x="310" y="190" class="small" text-anchor="middle"><tspan x="310" dy="0">公开值 A →</tspan></text><text x="310" y="285" class="small" text-anchor="middle"><tspan x="310" dy="0">← 公开值 B</tspan></text><path d="M153 164 V319" class="arrow" marker-end="url(#a)"/><path d="M467 164 V319" class="arrow" marker-end="url(#a)"/><rect x="28" y="319" width="250" height="92" rx="14" class="teal"/><text x="153" y="358.5" class="body" text-anchor="middle"><tspan x="153" dy="0">a + 对端公开值 B</tspan><tspan x="153" dy="29">算出共享秘密 S</tspan></text><rect x="342" y="319" width="250" height="92" rx="14" class="teal"/><text x="467" y="358.5" class="body" text-anchor="middle"><tspan x="467" dy="0">b + 对端公开值 A</tspan><tspan x="467" dy="29">算出同一秘密 S</tspan></text><text x="28" y="449" class="small" text-anchor="start"><tspan x="28" dy="0">公开值按约定的交换算法计算；S 不在线路上传输。</tspan></text><path d="M153 411 L153 490" class="arrow" marker-end="url(#a)"/><path d="M467 411 L467 490" class="arrow" marker-end="url(#a)"/><rect x="28" y="490" width="250" height="86" rx="14" class="neutral"/><text x="153" y="526.5" class="body" text-anchor="middle"><tspan x="153" dy="0">HKDF</tspan><tspan x="153" dy="29">用途标签 + 上下文</tspan></text><rect x="342" y="490" width="250" height="86" rx="14" class="neutral"/><text x="467" y="526.5" class="body" text-anchor="middle"><tspan x="467" dy="0">相同 HKDF 与上下文</tspan><tspan x="467" dy="29">得到一致工作材料</tspan></text><path d="M153 576 L153 618" class="arrow" marker-end="url(#a)"/><path d="M467 576 L467 618" class="arrow" marker-end="url(#a)"/><rect x="28" y="618" width="250" height="92" rx="14" class="blue"/><text x="153" y="657.5" class="body" text-anchor="middle"><tspan x="153" dy="0">发方向 K₁ / 收方向 K₂</tspan><tspan x="153" dy="29">具体协议还可派生 IV</tspan></text><rect x="342" y="618" width="250" height="92" rx="14" class="blue"/><text x="467" y="657.5" class="body" text-anchor="middle"><tspan x="467" dy="0">收方向 K₁ / 发方向 K₂</tspan><tspan x="467" dy="29">对应方向材料相同</tspan></text><text x="28" y="755" class="small" text-anchor="start"><tspan x="28" dy="0">本图只讲分工；还需认证对端，才能防止冒充。</tspan></text><text x="28" y="789" class="small" text-anchor="start"><tspan x="28" dy="0">TLS 完整调度另有 Early / Handshake / Master 分支。</tspan></text>
</svg>
