<svg xmlns="http://www.w3.org/2000/svg" width="620" height="950" viewBox="0 0 620 950" role="img" aria-labelledby="title desc">
<title id="title">证书卡片、信任路径和握手私钥证明</title><desc id="desc">虚构证书列出SAN、公钥、有效期和签发者签名；客户端结合本地信任锚验证路径、匹配URL目标名，再用证书公钥验证本次握手CertificateVerify。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="950" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">认对站点，需要两类检查</tspan></text><rect x="28" y="68" width="564" height="86" rx="14" class="blue"/><text x="310" y="104.5" class="body" text-anchor="middle"><tspan x="310" dy="0">URL 原目标：notes.example.com</tspan><tspan x="310" dy="29">即使 CNAME 指向别名，目标名不变</tspan></text><rect x="28" y="187" width="564" height="198" rx="14" class="neutral"/><text x="310" y="250.5" class="body" text-anchor="middle"><tspan x="310" dy="0">站点证书（教学字段，非运行输出）</tspan><tspan x="310" dy="29">SAN：notes.example.com</tspan><tspan x="310" dy="29">有效期 / 用途 / 公钥</tspan><tspan x="310" dy="29">签发者：中间 CA；签名覆盖证书内容</tspan></text><text x="28" y="435" class="heading" text-anchor="start"><tspan x="28" dy="0">① 证书是否可信、是否属于目标？</tspan></text><rect x="28" y="458" width="564" height="66" rx="14" class="teal"/><text x="310" y="499" class="body" text-anchor="middle"><tspan x="310" dy="0">本地已信任的根 / 信任锚</tspan></text><path d="M310 524 L310 560" class="arrow" marker-end="url(#a)"/><rect x="28" y="560" width="564" height="66" rx="14" class="teal"/><text x="310" y="601" class="body" text-anchor="middle"><tspan x="310" dy="0">验证中间 CA → 验证站点证书签名</tspan></text><path d="M310 626 L310 663" class="arrow" marker-end="url(#a)"/><rect x="28" y="663" width="564" height="66" rx="14" class="teal"/><text x="310" y="704" class="body" text-anchor="middle"><tspan x="310" dy="0">再核对 SAN、有效期、用途与本地策略</tspan></text><text x="28" y="782" class="heading" text-anchor="start"><tspan x="28" dy="0">② 对方现在是否真有对应私钥？</tspan></text><rect x="28" y="805" width="564" height="88" rx="14" class="blue"/><text x="310" y="842.5" class="body" text-anchor="middle"><tspan x="310" dy="0">取证书公钥验证 CertificateVerify</tspan><tspan x="310" dy="29">复制证书的人没有私钥，不能完成这个证明</tspan></text><text x="28" y="931" class="small" text-anchor="start"><tspan x="28" dy="0">CA 签证书；站点签本次握手；Finished 再认证握手。</tspan></text>
</svg>
