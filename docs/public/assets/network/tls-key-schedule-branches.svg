<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1110" viewBox="0 0 620 1110" role="img" aria-labelledby="title desc">
<title id="title">TLS1.3秘密调度分支与各方向key和IV</title><desc id="desc">Early Secret的derived输出与临时共享秘密经Extract得到Handshake Secret，分支出双向握手traffic secret与key和IV；主干derived加Extract零值到Master Secret，再分支出应用traffic secret与key和IV；应用secret另可KeyUpdate。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="1110" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">调度主干 ≠ 直接拿来加密的工作密钥</tspan></text><rect x="28" y="70" width="564" height="92" rx="14" class="neutral"/><text x="310" y="109.5" class="body" text-anchor="middle"><tspan x="310" dy="0">Early Secret 的 derived 输出</tspan><tspan x="310" dy="29">加临时共享秘密，经 HKDF-Extract</tspan></text><path d="M310 162 L310 202" class="arrow" marker-end="url(#a)"/><rect x="28" y="202" width="564" height="66" rx="14" class="blue"/><text x="310" y="243" class="body" text-anchor="middle"><tspan x="310" dy="0">Handshake Secret：主干秘密</tspan></text><path d="M310 268 L310 309" class="arrow" marker-end="url(#a)"/><rect x="28" y="309" width="564" height="92" rx="14" class="teal"/><text x="310" y="348.5" class="body" text-anchor="middle"><tspan x="310" dy="0">分支 A：结合握手摘要、区分方向</tspan><tspan x="310" dy="29">client / server handshake traffic secret</tspan></text><path d="M310 401 L310 438" class="arrow" marker-end="url(#a)"/><rect x="28" y="438" width="564" height="66" rx="14" class="teal"/><text x="310" y="479" class="body" text-anchor="middle"><tspan x="310" dy="0">各方向分别派生握手记录 key / IV</tspan></text><path d="M28 235 H14 V548 H310 V573" class="arrow" marker-end="url(#a)"/><text x="36" y="544" class="small" text-anchor="start"><tspan x="36" dy="0">从 Handshake Secret 主干继续</tspan></text><rect x="28" y="573" width="564" height="92" rx="14" class="blue"/><text x="310" y="612.5" class="body" text-anchor="middle"><tspan x="310" dy="0">derived 分支 → HKDF-Extract（零值）</tspan><tspan x="310" dy="29">Master Secret：主干秘密</tspan></text><path d="M310 665 L310 707" class="arrow" marker-end="url(#a)"/><rect x="28" y="707" width="564" height="92" rx="14" class="orange"/><text x="310" y="746.5" class="body" text-anchor="middle"><tspan x="310" dy="0">分支 B：结合握手摘要、区分方向</tspan><tspan x="310" dy="29">client / server application traffic secret 0</tspan></text><path d="M310 799 L310 836" class="arrow" marker-end="url(#a)"/><rect x="28" y="836" width="564" height="66" rx="14" class="orange"/><text x="310" y="877" class="body" text-anchor="middle"><tspan x="310" dy="0">各方向分别派生应用记录 key / IV</tspan></text><path d="M592 752 H607 V942 H310 V966" class="arrow" marker-end="url(#a)"/><text x="30" y="941" class="small" text-anchor="start"><tspan x="30" dy="0">KeyUpdate 从对应 application traffic secret 继续</tspan></text><rect x="28" y="966" width="564" height="66" rx="14" class="orange"/><text x="310" y="1007" class="body" text-anchor="middle"><tspan x="310" dy="0">下一代 application traffic secret → 新 key / IV</tspan></text><text x="28" y="1071" class="small" text-anchor="start"><tspan x="28" dy="0">握手 key / IV 不派生应用 key / IV；两者是不同分支。</tspan></text><text x="28" y="1097" class="small" text-anchor="start"><tspan x="28" dy="0">为读图省略恢复/导出器等分支；精确定义见 RFC 8446。</tspan></text>
</svg>
