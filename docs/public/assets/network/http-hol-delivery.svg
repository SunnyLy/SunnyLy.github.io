<svg xmlns="http://www.w3.org/2000/svg" width="620" height="910" viewBox="0 0 620 910" role="img" aria-labelledby="title desc">
<title id="title">数据到达不等于可以向上交付</title><desc id="desc">TCP字节0到99已交付，100到199缺失，后续含另一HTTP2流的200到299虽到仍等待；QUIC流A存在缺口时，流B完整可交付；注明共享拥塞和QPACK例外。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="910" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">到达缓冲区 ≠ 已交付给上层</tspan></text><text x="28" y="100" class="heading" text-anchor="start"><tspan x="28" dy="0">HTTP/2：先过 TCP 的整条有序字节流</tspan></text><rect x="28" y="126" width="176" height="92" rx="14" class="blue"/><text x="116" y="165.5" class="body" text-anchor="middle"><tspan x="116" dy="0">0…99</tspan><tspan x="116" dy="29">已到达</tspan></text><rect x="222" y="126" width="176" height="92" rx="14" class="red"/><text x="310" y="165.5" class="body" text-anchor="middle"><tspan x="310" dy="0">100…199</tspan><tspan x="310" dy="29">缺口</tspan></text><rect x="416" y="126" width="176" height="92" rx="14" class="teal"/><text x="504" y="165.5" class="body" text-anchor="middle"><tspan x="504" dy="0">200…299</tspan><tspan x="504" dy="29">已到达</tspan></text><text x="115" y="255" class="small" text-anchor="middle"><tspan x="115" dy="0">可交付</tspan></text><text x="310" y="255" class="small" text-anchor="middle"><tspan x="310" dy="0">等待恢复</tspan></text><text x="505" y="255" class="small" text-anchor="middle"><tspan x="505" dy="0">暂留 TCP</tspan></text><rect x="28" y="292" width="564" height="92" rx="14" class="neutral"/><text x="310" y="331.5" class="body" text-anchor="middle"><tspan x="310" dy="0">后段即使包含另一 HTTP 流的帧</tspan><tspan x="310" dy="29">也要先等 TCP 字节缺口补齐</tspan></text><text x="28" y="424" class="small" text-anchor="start"><tspan x="28" dy="0">示意字节区间是同一 TCP 流，不等于 HTTP 帧边界。</tspan></text><text x="28" y="489" class="heading" text-anchor="start"><tspan x="28" dy="0">HTTP/3：QUIC 按各流分别有序交付</tspan></text><rect x="28" y="518" width="176" height="92" rx="14" class="blue"/><text x="116" y="557.5" class="body" text-anchor="middle"><tspan x="116" dy="0">流 A 前段</tspan><tspan x="116" dy="29">已到达</tspan></text><rect x="222" y="518" width="176" height="92" rx="14" class="red"/><text x="310" y="557.5" class="body" text-anchor="middle"><tspan x="310" dy="0">流 A 缺口</tspan><tspan x="310" dy="29">等待恢复</tspan></text><rect x="416" y="518" width="176" height="92" rx="14" class="blue"/><text x="504" y="557.5" class="body" text-anchor="middle"><tspan x="504" dy="0">流 A 后段</tspan><tspan x="504" dy="29">暂存</tspan></text><rect x="28" y="651" width="370" height="70" rx="14" class="teal"/><text x="213" y="694" class="body" text-anchor="middle"><tspan x="213" dy="0">流 B 所需字节齐全</tspan></text><path d="M398 686 L455 686" class="arrow" marker-end="url(#a)"/><rect x="455" y="651" width="137" height="70" rx="14" class="teal"/><text x="523.5" y="694" class="body" text-anchor="middle"><tspan x="523.5" dy="0">可交付</tspan></text><text x="28" y="766" class="small" text-anchor="start"><tspan x="28" dy="0">此处比较传输交付；不把“到达”直接画成业务成功。</tspan></text><rect x="28" y="797" width="564" height="86" rx="14" class="orange"/><text x="310" y="833.5" class="small" text-anchor="middle"><tspan x="310" dy="0">仍共享拥塞和资源；QPACK 依赖也可能等待</tspan><tspan x="310" dy="29">所以：HTTP/3 并非“完全不会阻塞”</tspan></text>
</svg>
