<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
  <title id="title">反向代理如何把一个请求送到应用，再把响应送回浏览器</title>
  <desc id="desc">图对应本机HTTP模板。浏览器连接Nginx入口后，Nginx依次匹配监听地址和端口、虚拟服务器、路径，按照proxy_pass改写上游URI，再选择应用实例。应用响应沿上游连接回到Nginx，Nginx再沿客户端连接回复，两段连接都使用本机HTTP。</desc>
  <defs><marker id="down" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356fbb"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#21806b"/></marker></defs>
  <rect width="640" height="1000" rx="18" fill="#f7f9fc"/>
  <g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#16324f" text-anchor="middle">
    <text x="320" y="36" font-size="24" font-weight="700">浏览器到应用：配置要按请求顺序读</text>
    <rect x="34" y="65" width="490" height="80" rx="12" fill="white" stroke="#b3c9e8"/>
    <text x="279" y="96" font-size="21" font-weight="600">浏览器请求服务入口</text><text x="279" y="125" font-size="18">http://localhost:18080/api/health?x=1</text>
    <rect x="20" y="186" width="520" height="549" rx="16" fill="#eaf2ff" stroke="#9dbff0"/>
    <text x="280" y="217" font-size="20" font-weight="700">Nginx：接收请求，再组织一条上游请求</text>
    <g fill="white" stroke="#b3c9e8"><rect x="42" y="237" width="476" height="88" rx="10"/><rect x="42" y="365" width="476" height="88" rx="10"/><rect x="42" y="493" width="476" height="88" rx="10"/><rect x="42" y="621" width="476" height="88" rx="10"/></g>
    <text x="280" y="269" font-size="21" font-weight="600">① listen：先匹配入口地址 / 端口</text><text x="280" y="299" font-size="18">127.0.0.1:18080 接收客户端 HTTP 请求</text>
    <text x="280" y="397" font-size="21" font-weight="600">② server_name：选择虚拟站点</text><text x="280" y="427" font-size="18">此例 Host 是 localhost:18080，匹配 localhost</text>
    <text x="280" y="525" font-size="21" font-weight="600">③ location：按 URI 路径选择规则</text><text x="280" y="555" font-size="18">/api/health 匹配 location /api/</text>
    <text x="280" y="653" font-size="21" font-weight="600">④ proxy_pass：指定上游与 URI 规则</text><text x="280" y="683" font-size="18">示例带 /：去掉 /api/ → /health?x=1</text>
    <path d="M279 145V185" stroke="#356fbb" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <path d="M280 325V362" stroke="#356fbb" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <path d="M280 453V490" stroke="#356fbb" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <path d="M280 581V618" stroke="#356fbb" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <path d="M280 709V769" stroke="#356fbb" stroke-width="2.5" fill="none" marker-end="url(#down)"/>
    <rect x="34" y="772" width="490" height="93" rx="12" fill="#eaf7f2" stroke="#99ccba"/>
    <text x="279" y="807" font-size="21" font-weight="600">⑤ upstream：选实例，通过上游连接发送</text><text x="279" y="839" font-size="18">应用收到 HTTP GET /health?x=1，返回结果</text>
    <path d="M524 820H578V567" stroke="#21806b" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#back)"/>
    <path d="M578 379V110H527" stroke="#21806b" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#back)"/>
    <rect x="545" y="379" width="66" height="185" rx="10" fill="#eaf7f2" stroke="#99ccba"/>
    <text x="578" y="414" font-size="17" font-weight="600">Nginx</text><text x="578" y="451" font-size="16">接上游</text><text x="578" y="485" font-size="16">响应</text><text x="578" y="520" font-size="16">回客户</text><text x="578" y="546" font-size="16">端连接</text>
    <text x="320" y="910" font-size="19">绿线是逻辑返回路径，实际仍经过 Nginx：</text>
    <text x="320" y="941" font-size="19">上游 HTTP 响应 → Nginx → 客户端 HTTP 响应</text>
    <text x="320" y="975" font-size="17">两段连接可复用；不是每个请求都必须重新 TCP 握手。</text>
  </g>
</svg>
