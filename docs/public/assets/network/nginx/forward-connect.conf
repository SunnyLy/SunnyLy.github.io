# Requires nginx >= 1.31.0 with ngx_http_tunnel_module.
# Local HTTPS CONNECT lab only. The allowed destination must be your own server.
worker_processes 1;
pid logs/forward-connect.pid;
error_log logs/forward-connect-error.log warn;
events { worker_connections 128; }

http {
    # Target comes from CONNECT authority, not arbitrary client-controlled DNS.
    map "$host:$request_port" $connect_allowed {
        default 0;
        "127.0.0.1:18443" 1;
    }
    access_log logs/forward-connect-access.log;

    server {
        listen 127.0.0.1:18082;
        if ($connect_allowed = 0) { return 403; }
        tunnel_connect_timeout 2s;
        tunnel_read_timeout 30s;
        # Default destination is $host:$request_port from CONNECT.
        tunnel_pass;
    }
}
