# Complete local-only main configuration. Run from an isolated nginx prefix.
worker_processes 1;
pid logs/reverse-http.pid;
error_log logs/reverse-http-error.log warn;
events { worker_connections 128; }

http {
    log_format proxy_lab '$remote_addr "$request" status=$status '
                         'upstream=$upstream_addr upstream_status=$upstream_status '
                         'request_time=$request_time upstream_time=$upstream_response_time';
    access_log logs/reverse-http-access.log proxy_lab;

    upstream notes_app {
        server 127.0.0.1:18081;
        keepalive 8; # Idle upstream connections per worker, not a request limit.
    }

    # Shared by both locations below; neither defines its own header group.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    client_max_body_size 1m;

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        location /api/ {
            # URI "/" replaces the matching "/api/" prefix.
            # /api/health?x=1 -> /health?x=1
            proxy_pass http://notes_app/;
        }
        location / {
            # No URI after notes_app: preserve the incoming path/query.
            proxy_pass http://notes_app;
        }
    }
}
