<svg xmlns="http://www.w3.org/2000/svg" width="620" height="840" viewBox="0 0 620 840" role="img" aria-labelledby="title desc">
<title id="title">轮询长轮询SSE的请求响应边界</title><desc id="desc">轮询每次请求返回结束；长轮询一次请求等待新结果或超时后结束再重发；SSE一次请求的一份持续响应内有多次事件，示意不规定等间隔。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="840" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">同一个下载进度：客户端怎样等结果？</tspan></text><text x="28" y="105" class="heading" text-anchor="start"><tspan x="28" dy="0">① 短轮询：每次都问一次</tspan></text><rect x="28" y="133" width="564" height="72" rx="14" class="blue"/><text x="310" y="177" class="body" text-anchor="middle"><tspan x="310" dy="0">请求① → 响应 10%［本次结束］</tspan></text><rect x="28" y="220" width="564" height="72" rx="14" class="blue"/><text x="310" y="264" class="body" text-anchor="middle"><tspan x="310" dy="0">请求② → 响应 30%［本次结束］</tspan></text><text x="28" y="327" class="small" text-anchor="start"><tspan x="28" dy="0">间隔期间有新进度，通常要等下一次问。</tspan></text><text x="28" y="390" class="heading" text-anchor="start"><tspan x="28" dy="0">② 长轮询：这次先别结束</tspan></text><rect x="28" y="418" width="564" height="102" rx="14" class="teal"/><text x="310" y="462.5" class="body" text-anchor="middle"><tspan x="310" dy="0">请求① → 等新进度 / 超时 → 响应结束</tspan><tspan x="310" dy="29">客户端再发请求②</tspan></text><text x="28" y="554" class="small" text-anchor="start"><tspan x="28" dy="0">仍是一轮轮独立 HTTP 请求 / 响应。</tspan></text><text x="28" y="614" class="heading" text-anchor="start"><tspan x="28" dy="0">③ SSE：一次响应里，持续给进度</tspan></text><rect x="28" y="642" width="564" height="113" rx="14" class="orange"/><text x="310" y="692" class="body" text-anchor="middle"><tspan x="310" dy="0">GET /events → 同一响应仍在继续</tspan><tspan x="310" dy="29">事件 10% → 事件 30% → 事件 70% …</tspan></text><text x="28" y="798" class="small" text-anchor="start"><tspan x="28" dy="0">事件 ≠ HTTP 响应；服务器不是凭空发起 HTTP 请求。</tspan></text>
</svg>
