<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1000" viewBox="0 0 620 1000" role="img" aria-labelledby="title desc">
<title id="title">SSE网络读取片段如何拼成事件</title><desc id="desc">两次示意读取将data行拆开，解析器缓冲UTF8字节直到空行，才把id、event、data映射成tick回调参数；另一个done事件由其监听器主动关闭；任意阶段的EOF可触发恢复，而非tick回调的后续步骤或业务完成信号。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="1000" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">一段网络读取，不等于一个 SSE 事件</tspan></text><rect x="28" y="73" width="564" height="92" rx="14" class="blue"/><text x="310" y="112.5" class="small" text-anchor="middle"><tspan x="310" dy="0">读取片段①（示意）</tspan><tspan x="310" dy="29">id: 1\nevent: tick\ndata: {&quot;ti</tspan></text><rect x="28" y="194" width="564" height="92" rx="14" class="teal"/><text x="310" y="233.5" class="small" text-anchor="middle"><tspan x="310" dy="0">读取片段②（示意）</tspan><tspan x="310" dy="29">ck&quot;: 1}\n\n</tspan></text><path d="M590 119 H606 V335 H310 V366" class="arrow" marker-end="url(#a)"/><path d="M310 286 V366" class="arrow" marker-end="url(#a)"/><rect x="28" y="366" width="564" height="88" rx="14" class="neutral"/><text x="310" y="403.5" class="body" text-anchor="middle"><tspan x="310" dy="0">按 UTF-8 / 行规则持续缓冲</tspan><tspan x="310" dy="29">还没读到结束空行，就不派发这个事件</tspan></text><path d="M310 454 L310 503" class="arrow" marker-end="url(#a)"/><rect x="28" y="503" width="564" height="126" rx="14" class="teal"/><text x="310" y="545" class="small" text-anchor="middle"><tspan x="310" dy="0">空行到齐 → 派发完整事件</tspan><tspan x="310" dy="29">event: tick → tick 监听器</tspan><tspan x="310" dy="29">id: 1 → lastEventId；data → event.data</tspan></text><path d="M310 629 L310 678" class="arrow" marker-end="url(#a)"/><rect x="28" y="678" width="564" height="64" rx="14" class="blue"/><text x="310" y="718" class="body" text-anchor="middle"><tspan x="310" dy="0">JavaScript tick 回调读取数据</tspan></text><text x="28" y="769" class="small">独立事件：不以 tick 回调为前提</text><rect x="28" y="780" width="264" height="100" rx="14" class="teal"/><text x="160" y="823.5" class="body" text-anchor="middle"><tspan x="160" dy="0">另解析到 done 事件</tspan><tspan x="160" dy="29">done 监听器 close()</tspan></text><rect x="328" y="780" width="264" height="100" rx="14" class="orange"/><text x="460" y="823.5" class="body" text-anchor="middle"><tspan x="460" dy="0">任意阶段断开 / EOF</tspan><tspan x="460" dy="29">判断是否进入重连</tspan></text><text x="28" y="924" class="small" text-anchor="start"><tspan x="28" dy="0">\n 表示换行字节；两次读取只是示例，不代表固定分段。</tspan></text><text x="28" y="963" class="small" text-anchor="start"><tspan x="28" dy="0">Last-Event-ID 只报位置；恢复还依赖服务端保留历史。</tspan></text>
</svg>
