<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1100" viewBox="0 0 680 1100" role="img" aria-labelledby="title desc">
  <title id="title">TCP 三次握手与四次挥手：同一条连接的完整过程</title>
  <desc id="desc">客户端和服务端初始序号分别为100和500。三次握手后客户端发送10字节，服务端发送20字节并确认客户端数据。客户端先发送FIN，序号111确认521；服务端确认112，随后发送FIN序号521确认112；客户端最终确认522并处于TIME-WAIT，服务端收到最终确认后关闭。示例没有丢包，未合并关闭时的ACK和FIN。</desc>
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#17243d}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:700}.msg{font-size:22px;font-weight:600}.small{font-size:20px;fill:#4b5c77}.state{font-size:18px;fill:#45607d;font-weight:650}.line{fill:none;stroke:#526781;stroke-width:2.5;marker-end:url(#arrow)}.life{stroke:#a6b4c7;stroke-width:2;stroke-dasharray:6 6}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9" fill="#526781"/></marker></defs>
  <rect width="680" height="1100" rx="24" fill="#f5f8fd"/>
  <text class="title" x="28" y="48">同一条 TCP 连接：先建，再用，再关</text>
  <text class="small" x="28" y="84">时间向下走；状态标在报文发送 / 收到之后</text>
  <rect x="48" y="105" width="154" height="48" rx="12" fill="#e7edff"/><text class="head" x="125" y="137" text-anchor="middle">客户端</text>
  <rect x="478" y="105" width="154" height="48" rx="12" fill="#def3ee"/><text class="head" x="555" y="137" text-anchor="middle">服务端</text>
  <rect x="20" y="169" width="640" height="276" rx="16" fill="#e8f1ff"/>
  <rect x="20" y="457" width="640" height="164" rx="16" fill="#e5f4ed"/>
  <rect x="20" y="633" width="640" height="406" rx="16" fill="#fff0df"/>
  <path class="life" d="M125 155v870 M555 155v850"/>
  <text class="head" x="40" y="201">建连：双方确认起始序号</text>
  <text class="msg" x="340" y="233" text-anchor="middle">① SYN：我从 100 开始</text><path class="line" d="M125 248H555"/>
  <text class="state" x="125" y="272" text-anchor="middle">SYN-SENT</text><text class="state" x="555" y="272" text-anchor="middle">SYN-RECEIVED</text>
  <text class="msg" x="340" y="307" text-anchor="middle">② SYN + ACK：收到，我从 500 开始</text><path class="line" d="M555 323H125"/>
  <text class="state" x="340" y="347" text-anchor="middle">seq=500，ack=101</text>
  <text class="state" x="125" y="347" text-anchor="middle">ESTABLISHED</text>
  <text class="msg" x="340" y="382" text-anchor="middle">③ ACK：收到你的起始编号</text><path class="line" d="M125 398H555"/>
  <text class="state" x="340" y="424" text-anchor="middle">seq=101，ack=501</text>
  <text class="state" x="555" y="424" text-anchor="middle">ESTABLISHED</text>
  <text class="head" x="40" y="489">传数据：两个方向各自编号</text>
  <text class="small" x="340" y="520" text-anchor="middle">10 字节 · seq=101，ack=501</text><path class="line" d="M125 535H555"/>
  <text class="small" x="340" y="580" text-anchor="middle">20 字节 · seq=501，ack=111</text><path class="line" d="M555 595H125"/>
  <text class="head" x="40" y="665">断连：两个方向分别结束发送</text>
  <text class="msg" x="340" y="700" text-anchor="middle">① FIN + ACK：我发完了</text><path class="line" d="M125 716H555"/>
  <text class="state" x="340" y="740" text-anchor="middle">seq=111，ack=521</text>
  <text class="state" x="125" y="740" text-anchor="middle">FIN-WAIT-1</text><text class="state" x="555" y="740" text-anchor="middle">CLOSE-WAIT</text>
  <text class="msg" x="340" y="778" text-anchor="middle">② ACK：知道了，你不再发</text><path class="line" d="M555 794H125"/>
  <text class="state" x="340" y="818" text-anchor="middle">seq=521，ack=112</text>
  <text class="state" x="125" y="818" text-anchor="middle">FIN-WAIT-2</text>
  <text class="small" x="413" y="843" text-anchor="middle">服务端应用也结束发送后</text>
  <text class="msg" x="340" y="876" text-anchor="middle">③ FIN + ACK：我也发完了</text><path class="line" d="M555 892H125"/>
  <text class="state" x="340" y="916" text-anchor="middle">seq=521，ack=112</text>
  <text class="state" x="125" y="916" text-anchor="middle">TIME-WAIT</text><text class="state" x="555" y="916" text-anchor="middle">LAST-ACK</text>
  <text class="msg" x="340" y="954" text-anchor="middle">④ ACK：知道了，你也不再发</text><path class="line" d="M125 970H555"/>
  <text class="state" x="340" y="995" text-anchor="middle">seq=112，ack=522</text>
  <text class="state" x="555" y="995" text-anchor="middle">CLOSED</text><text class="state" x="125" y="1024" text-anchor="middle">2×MSL 后 CLOSED</text>
  <text class="small" x="28" y="1073">典型无丢包过程；关闭时 ACK 与 FIN 也可以合并。</text>
</svg>
