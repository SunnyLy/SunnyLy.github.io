<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1000" viewBox="0 0 620 1000" role="img" aria-labelledby="title desc">
<title id="title">PBKDF2 迭代与 HKDF 的区别</title><desc id="desc">PBKDF2 对每个输出块进行重复 PRF 运算并异或，增加猜口令成本；HKDF 为秘密做提取和用途分隔，不是慢口令函数。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="1000" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">PBKDF2：让猜一次更贵</tspan></text><rect x="32" y="66" width="556" height="94" rx="12" class="blue"/><text x="310" y="98" class="body" text-anchor="middle"><tspan x="310" dy="0">输入：口令 / salt / 次数 c</tspan><tspan x="310" dy="28">PRF：例 HMAC-SHA256</tspan></text><path d="M310 160V190" class="arrow" marker-end="url(#a)"/><rect x="32" y="198" width="556" height="150" rx="12" class="blue"/><text x="310" y="230" class="body" text-anchor="middle"><tspan x="310" dy="0">U₁ = PRF(P, salt || INT(i))</tspan><tspan x="310" dy="28">U₂ = PRF(P, U₁) … Uc</tspan><tspan x="310" dy="28">Tᵢ = U₁ XOR U₂ … XOR Uc</tspan><tspan x="310" dy="28">i 为输出块编号，不是迭代次数</tspan></text><path d="M310 348V378" class="arrow" marker-end="url(#a)"/><rect x="32" y="386" width="556" height="94" rx="12" class="teal"/><text x="310" y="418" class="body" text-anchor="middle"><tspan x="310" dy="0">拼接 T₁ / T₂ …，截到 dkLen</tspan><tspan x="310" dy="28">盐 / PRF / 次数 / 长度随记录保存</tspan></text><text x="310" y="536" class="heading" text-anchor="middle"><tspan x="310" dy="0">HKDF：把秘密分给不同用途</tspan></text><rect x="32" y="564" width="556" height="94" rx="12" class="blue"/><text x="310" y="596" class="body" text-anchor="middle"><tspan x="310" dy="0">共享秘密 + salt</tspan><tspan x="310" dy="28">Extract → 伪随机密钥 PRK</tspan></text><path d="M310 658V688" class="arrow" marker-end="url(#a)"/><rect x="32" y="696" width="556" height="94" rx="12" class="teal"/><text x="310" y="728" class="body" text-anchor="middle"><tspan x="310" dy="0">PRK + info + 长度</tspan><tspan x="310" dy="28">Expand → 指定用途的 key</tspan></text><rect x="32" y="832" width="556" height="122" rx="12" class="orange"/><text x="310" y="864" class="body" text-anchor="middle"><tspan x="310" dy="0">HKDF 不为猜口令增加大量成本</tspan><tspan x="310" dy="28">PBKDF2 不凭空增加口令熵</tspan><tspan x="310" dy="28">二者都不能补救泄漏的输入秘密</tspan></text>
</svg>
