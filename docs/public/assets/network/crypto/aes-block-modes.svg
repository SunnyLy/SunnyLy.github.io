<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1090" viewBox="0 0 620 1090" role="img" aria-labelledby="title desc">
<title id="title">AES 分组引擎与模式</title><desc id="desc">AES 固定处理十六字节；轮密钥来自密钥扩展。ECB 保留重复模式，CBC 链接上一密文，CTR 加密独立计数器后与明文异或。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="1090" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">1. 一个 AES 引擎</tspan></text><rect x="32" y="66" width="556" height="66" rx="12" class="blue"/><text x="310" y="98" class="body" text-anchor="middle"><tspan x="310" dy="0">输入分组：16 字节</tspan></text><path d="M310 132V162" class="arrow" marker-end="url(#a)"/><rect x="32" y="168" width="556" height="94" rx="12" class="teal"/><text x="310" y="200" class="body" text-anchor="middle"><tspan x="310" dy="0">多轮变换 + 加轮密钥</tspan><tspan x="310" dy="28">key expansion → 每轮的轮密钥</tspan></text><path d="M310 262V292" class="arrow" marker-end="url(#a)"/><rect x="32" y="298" width="556" height="66" rx="12" class="blue"/><text x="310" y="330" class="body" text-anchor="middle"><tspan x="310" dy="0">输出分组：16 字节</tspan></text><text x="310" y="402" class="small" text-anchor="middle"><tspan x="310" dy="0">密钥可以是 16 / 24 / 32 字节</tspan></text><text x="310" y="454" class="heading" text-anchor="middle"><tspan x="310" dy="0">2. 模式决定多个分组怎么处理</tspan></text><rect x="32" y="480" width="556" height="94" rx="12" class="red"/><text x="310" y="512" class="body" text-anchor="middle"><tspan x="310" dy="0">ECB：P₁ → AES → C₁</tspan><tspan x="310" dy="28">若 P₁ = P₂，则 C₁ = C₂</tspan></text><rect x="32" y="598" width="556" height="122" rx="12" class="blue"/><text x="310" y="630" class="body" text-anchor="middle"><tspan x="310" dy="0">CBC：C₀ = IV</tspan><tspan x="310" dy="28">Pᵢ XOR Cᵢ₋₁ → AES → Cᵢ</tspan><tspan x="310" dy="28">上一密文进入下一块运算</tspan></text><rect x="32" y="744" width="556" height="122" rx="12" class="teal"/><text x="310" y="776" class="body" text-anchor="middle"><tspan x="310" dy="0">CTR：counterᵢ → AES → Sᵢ</tspan><tspan x="310" dy="28">Pᵢ XOR Sᵢ → Cᵢ</tspan><tspan x="310" dy="28">所有 counter 块不得重复</tspan></text><rect x="32" y="902" width="556" height="122" rx="12" class="orange"/><text x="310" y="934" class="body" text-anchor="middle"><tspan x="310" dy="0">CBC / CTR 本身没有认证</tspan><tspan x="310" dy="28">IV / counter 的规则不同</tspan><tspan x="310" dy="28">优先选成熟 AEAD</tspan></text>
</svg>
