<svg xmlns="http://www.w3.org/2000/svg" width="620" height="790" viewBox="0 0 620 790" role="img" aria-labelledby="title desc">
<title id="title">证书签发与身份验证总览</title><desc id="desc">站点只提交公开 CSR，私钥留本机。CA 验证申请资格并签证书。客户端从预置信任锚验证路径和目标身份，站点再证明私钥持有。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="790" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">公钥公开，私钥不交给 CA</tspan></text><rect x="32" y="66" width="556" height="94" rx="12" class="blue"/><text x="310" y="98" class="body" text-anchor="middle"><tspan x="310" dy="0">站点：生成密钥，私钥留本机</tspan><tspan x="310" dy="28">CSR：身份申请 + 公钥 + 申请者签名</tspan></text><path d="M310 160V190" class="arrow" marker-end="url(#a)"/><text x="460" y="188" class="small" text-anchor="middle"><tspan x="460" dy="0">只交公开 CSR</tspan></text><rect x="32" y="206" width="556" height="94" rx="12" class="teal"/><text x="310" y="238" class="body" text-anchor="middle"><tspan x="310" dy="0">CA：验证申请资格 / 域名控制</tspan><tspan x="310" dy="28">签发：身份 + 公钥 + CA 签名</tspan></text><path d="M310 300V330" class="arrow" marker-end="url(#a)"/><rect x="32" y="342" width="556" height="94" rx="12" class="blue"/><text x="310" y="374" class="body" text-anchor="middle"><tspan x="310" dy="0">站点部署证书与中间链</tspan><tspan x="310" dy="28">握手时另用私钥证明持有</tspan></text><path d="M310 436V466" class="arrow" marker-end="url(#a)"/><rect x="32" y="478" width="556" height="122" rx="12" class="teal"/><text x="310" y="510" class="body" text-anchor="middle"><tspan x="310" dy="0">客户端：自身信任锚 → 验证路径</tspan><tspan x="310" dy="28">校验目标名 / 有效期 / 用途等</tspan><tspan x="310" dy="28">不因服务器发根证书就信任它</tspan></text><rect x="32" y="642" width="556" height="94" rx="12" class="orange"/><text x="310" y="674" class="body" text-anchor="middle"><tspan x="310" dy="0">证书认证身份，不授予业务权限</tspan><tspan x="310" dy="28">详细签发 / 验证见 TLS 篇</tspan></text>
</svg>
