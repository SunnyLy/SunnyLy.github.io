<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
<title id="title">AEAD 参数与认证关口</title><desc id="desc">密钥与唯一 nonce 输入 AEAD，AAD 被认证而不加密。接收端必须认证成功才交付明文。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="760" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">同一份消息，有四类输入</tspan></text><rect x="32" y="66" width="270" height="94" rx="12" class="blue"/><text x="167" y="98" class="body" text-anchor="middle"><tspan x="167" dy="0">key：秘密</tspan><tspan x="167" dy="28">nonce：同 key 下唯一</tspan></text><rect x="318" y="66" width="270" height="94" rx="12" class="teal"/><text x="453" y="98" class="body" text-anchor="middle"><tspan x="453" dy="0">明文：要隐藏</tspan><tspan x="453" dy="28">AAD：可见但防改</tspan></text><path d="M170 160V192H310V218" class="arrow" marker-end="url(#a)"/><path d="M450 160V192H310" class="arrow" marker-end="url(#a)"/><rect x="112" y="226" width="396" height="94" rx="12" class="blue"/><text x="310" y="258" class="body" text-anchor="middle"><tspan x="310" dy="0">AEAD 加密</tspan><tspan x="310" dy="28">输出：密文 + tag</tspan></text><path d="M310 320V350" class="arrow" marker-end="url(#a)"/><rect x="32" y="358" width="556" height="94" rx="12" class="orange"/><text x="310" y="390" class="body" text-anchor="middle"><tspan x="310" dy="0">传输或按协议重建：nonce / AAD</tspan><tspan x="310" dy="28">密文 / tag 传输；key 不随消息发送</tspan></text><path d="M310 452V482" class="arrow" marker-end="url(#a)"/><rect x="112" y="490" width="396" height="66" rx="12" class="blue"/><text x="310" y="522" class="body" text-anchor="middle"><tspan x="310" dy="0">接收端：先认证再交付</tspan></text><path d="M310 556V590H170V612" class="arrow" marker-end="url(#a)"/><path d="M310 590H450V612" class="arrow" marker-end="url(#a)"/><rect x="32" y="620" width="270" height="94" rx="12" class="teal"/><text x="167" y="652" class="body" text-anchor="middle"><tspan x="167" dy="0">成功</tspan><tspan x="167" dy="28">交付明文</tspan></text><rect x="318" y="620" width="270" height="94" rx="12" class="red"/><text x="453" y="652" class="body" text-anchor="middle"><tspan x="453" dy="0">失败：InvalidTag</tspan><tspan x="453" dy="28">拒绝数据</tspan></text>
</svg>
