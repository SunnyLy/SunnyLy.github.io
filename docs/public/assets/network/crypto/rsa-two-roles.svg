<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1000" viewBox="0 0 620 1000" role="img" aria-labelledby="title desc">
<title id="title">RSA OAEP 与 PSS 两种用途</title><desc id="desc">OAEP 先编码短秘密，再执行 RSA 公钥原语，私钥恢复并验证编码；PSS 编码消息摘要，私钥签名，公钥验签。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="1000" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">加密路线：保护短秘密</tspan></text><rect x="32" y="68" width="556" height="66" rx="12" class="blue"/><text x="310" y="100" class="body" text-anchor="middle"><tspan x="310" dy="0">随机 AES key → OAEP 随机化编码</tspan></text><path d="M310 134V164" class="arrow" marker-end="url(#a)"/><rect x="32" y="172" width="556" height="94" rx="12" class="blue"/><text x="310" y="204" class="body" text-anchor="middle"><tspan x="310" dy="0">RSA 公钥原语：c = mᵉ mod n</tspan><tspan x="310" dy="28">得到密钥包装结果，不是加密大文件</tspan></text><path d="M310 266V296" class="arrow" marker-end="url(#a)"/><rect x="32" y="304" width="556" height="94" rx="12" class="teal"/><text x="310" y="336" class="body" text-anchor="middle"><tspan x="310" dy="0">私钥恢复 + OAEP 解码检查</tspan><tspan x="310" dy="28">得到 AES key → 用 AEAD 解密数据</tspan></text><text x="310" y="454" class="heading" text-anchor="middle"><tspan x="310" dy="0">签名路线：证明持有私钥</tspan></text><rect x="32" y="482" width="556" height="66" rx="12" class="blue"/><text x="310" y="514" class="body" text-anchor="middle"><tspan x="310" dy="0">消息摘要 → PSS 随机化编码</tspan></text><path d="M310 548V578" class="arrow" marker-end="url(#a)"/><rect x="32" y="586" width="556" height="94" rx="12" class="blue"/><text x="310" y="618" class="body" text-anchor="middle"><tspan x="310" dy="0">RSA 私钥签名原语</tspan><tspan x="310" dy="28">使用签名专用密钥</tspan></text><path d="M310 680V710" class="arrow" marker-end="url(#a)"/><rect x="32" y="718" width="556" height="94" rx="12" class="teal"/><text x="310" y="750" class="body" text-anchor="middle"><tspan x="310" dy="0">可信公钥 + 消息 + 签名</tspan><tspan x="310" dy="28">验证 PSS 编码是否匹配</tspan></text><rect x="32" y="850" width="556" height="94" rx="12" class="orange"/><text x="310" y="882" class="body" text-anchor="middle"><tspan x="310" dy="0">OAEP / PSS 不是补空格</tspan><tspan x="310" dy="28">不省略编码，不反用接口</tspan></text>
</svg>
