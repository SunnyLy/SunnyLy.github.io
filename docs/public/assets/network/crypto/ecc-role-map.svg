<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040" role="img" aria-labelledby="title desc">
<title id="title">ECC 协商与签名的分工</title><desc id="desc">椭圆曲线点乘说明 ECDH：双方只交换公开点，各自用私有标量计算同一共享点。X25519 是协商，ECDSA 和 Ed25519 是签名。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef}.teal{fill:#eaf8f3;stroke:#90cab8}.orange{fill:#fff4e7;stroke:#e4b77b}.red{fill:#fff0ee;stroke:#dfaaa5}.arrow{fill:none;stroke:#53677f;stroke-width:2}</style>
<rect width="620" height="1040" rx="18" fill="#fff"/>
<text x="310" y="40" class="heading" text-anchor="middle"><tspan x="310" dy="0">ECDH：秘密不穿过网络</tspan></text><rect x="32" y="66" width="270" height="94" rx="12" class="blue"/><text x="167" y="98" class="body" text-anchor="middle"><tspan x="167" dy="0">Alice 私有 dA</tspan><tspan x="167" dy="28">公开 QA = dA·G</tspan></text><rect x="318" y="66" width="270" height="94" rx="12" class="teal"/><text x="453" y="98" class="body" text-anchor="middle"><tspan x="453" dy="0">Bob 私有 dB</tspan><tspan x="453" dy="28">公开 QB = dB·G</tspan></text><path d="M166 160V192H454V224" class="arrow" marker-end="url(#a)"/><text x="310" y="216" class="small" text-anchor="middle"><tspan x="310" dy="0">只交换 QA / QB</tspan></text><path d="M454 160V178H166V224" class="arrow" marker-end="url(#a)"/><rect x="32" y="232" width="270" height="94" rx="12" class="blue"/><text x="167" y="264" class="body" text-anchor="middle"><tspan x="167" dy="0">本机算 dA·QB</tspan><tspan x="167" dy="28">= dA·dB·G</tspan></text><rect x="318" y="232" width="270" height="94" rx="12" class="teal"/><text x="453" y="264" class="body" text-anchor="middle"><tspan x="453" dy="0">本机算 dB·QA</tspan><tspan x="453" dy="28">= dB·dA·G</tspan></text><text x="310" y="364" class="small" text-anchor="middle"><tspan x="310" dy="0">同一共享点 → 规范编码的共享秘密</tspan></text><path d="M310 378V402" class="arrow" marker-end="url(#a)"/><rect x="32" y="410" width="556" height="94" rx="12" class="orange"/><text x="310" y="442" class="body" text-anchor="middle"><tspan x="310" dy="0">KDF 分用途派生 key</tspan><tspan x="310" dy="28">还必须认证：收到的公钥属于谁？</tspan></text><text x="310" y="562" class="heading" text-anchor="middle"><tspan x="310" dy="0">家族里有不同任务</tspan></text><rect x="32" y="590" width="556" height="94" rx="12" class="blue"/><text x="310" y="622" class="body" text-anchor="middle"><tspan x="310" dy="0">协商：ECDH / X25519</tspan><tspan x="310" dy="28">结果是共享秘密，不是签名</tspan></text><rect x="32" y="714" width="556" height="94" rx="12" class="teal"/><text x="310" y="746" class="body" text-anchor="middle"><tspan x="310" dy="0">签名：ECDSA / Ed25519</tspan><tspan x="310" dy="28">私钥签，可信公钥验，不隐藏消息</tspan></text><rect x="32" y="838" width="556" height="122" rx="12" class="orange"/><text x="310" y="870" class="body" text-anchor="middle"><tspan x="310" dy="0">签名 key 与协商 key 分开</tspan><tspan x="310" dy="28">ECDSA 秘密 k ≠ AEAD 公开 nonce</tspan><tspan x="310" dy="28">点乘图不表示 API 字节格式可互换</tspan></text>
</svg>
