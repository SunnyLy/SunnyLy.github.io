<svg xmlns="http://www.w3.org/2000/svg" width="620" height="790" viewBox="0 0 620 790" role="img" aria-labelledby="title desc">
<title id="title">三个资源在不同HTTP版本上的调度</title><desc id="desc">同一页面请求图片A、样式B、笔记C，以服务端响应方向对比HTTP1.1同连接常见串行、HTTP2流帧交错、HTTP3QUIC流，资源颜色一致而非表示包边界。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="790" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">同一页：图片 A、样式 B、笔记 C</tspan></text><rect x="28" y="64" width="564" height="65" rx="14" class="neutral"/><text x="310" y="104.5" class="body" text-anchor="middle"><tspan x="310" dy="0">先有客户端 GET → 服务端处理</tspan></text><text x="28" y="177" class="heading" text-anchor="start"><tspan x="28" dy="0">下面只画响应：服务端 → 客户端</tspan></text><text x="28" y="227" class="body" text-anchor="start"><tspan x="28" dy="0">HTTP/1.1 · 同连接常见串行</tspan></text><rect x="28" y="249" width="184" height="58" rx="14" class="blue"/><text x="120" y="286" class="body" text-anchor="middle"><tspan x="120" dy="0">A 全部</tspan></text><rect x="218" y="249" width="184" height="58" rx="14" class="teal"/><text x="310" y="286" class="body" text-anchor="middle"><tspan x="310" dy="0">B 全部</tspan></text><rect x="408" y="249" width="184" height="58" rx="14" class="orange"/><text x="500" y="286" class="body" text-anchor="middle"><tspan x="500" dy="0">C 全部</tspan></text><path d="M28 335 L592 335" class="arrow" marker-end="url(#a)"/><text x="310" y="366" class="small" text-anchor="middle"><tspan x="310" dy="0">发送先后 →</tspan></text><text x="28" y="423" class="body" text-anchor="start"><tspan x="28" dy="0">HTTP/2 · 同连接内交错帧</tspan></text><rect x="28" y="445" width="106" height="62" rx="14" class="blue"/><text x="81" y="484" class="body" text-anchor="middle"><tspan x="81" dy="0">A₁</tspan></text><rect x="142" y="445" width="106" height="62" rx="14" class="teal"/><text x="195" y="484" class="body" text-anchor="middle"><tspan x="195" dy="0">B₁</tspan></text><rect x="256" y="445" width="106" height="62" rx="14" class="blue"/><text x="309" y="484" class="body" text-anchor="middle"><tspan x="309" dy="0">A₂</tspan></text><rect x="370" y="445" width="106" height="62" rx="14" class="orange"/><text x="423" y="484" class="body" text-anchor="middle"><tspan x="423" dy="0">C₁</tspan></text><rect x="484" y="445" width="108" height="62" rx="14" class="teal"/><text x="538" y="484" class="body" text-anchor="middle"><tspan x="538" dy="0">B₂</tspan></text><text x="28" y="545" class="small" text-anchor="start"><tspan x="28" dy="0">编号识别所属流，不靠“到达先后”猜资源。</tspan></text><text x="28" y="604" class="body" text-anchor="start"><tspan x="28" dy="0">HTTP/3 · HTTP 帧放进各自 QUIC 流</tspan></text><rect x="28" y="626" width="176" height="62" rx="14" class="blue"/><text x="116" y="665" class="body" text-anchor="middle"><tspan x="116" dy="0">流 A</tspan></text><rect x="222" y="626" width="176" height="62" rx="14" class="teal"/><text x="310" y="665" class="body" text-anchor="middle"><tspan x="310" dy="0">流 B</tspan></text><rect x="416" y="626" width="176" height="62" rx="14" class="orange"/><text x="504" y="665" class="body" text-anchor="middle"><tspan x="504" dy="0">流 C</tspan></text><text x="28" y="729" class="small" text-anchor="start"><tspan x="28" dy="0">小块只示意调度，不代表固定大小或 TCP / UDP 包。</tspan></text><text x="28" y="765" class="small" text-anchor="start"><tspan x="28" dy="0">H1 还可用多连接/流水线；这里选常见串行对比。</tspan></text>
</svg>
