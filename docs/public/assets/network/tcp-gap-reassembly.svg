<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="title desc">
<title id="title">补齐缺口，后面的字节才能交给应用</title>
<desc id="desc">接收端已按序收到1001到2000，缺少2001到3000，3001到4000先到并可暂存。累计ACK仍为2001。发送端判断丢失后重传缺口，补齐后累计确认到4001并按序交付。示意不表示单个重复ACK就触发快速重传。</desc>
<defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#17243d}.title{font-size:27px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#4b5c77}.strong{font-size:23px;font-weight:650}.mono{font-size:20px;font-family:Consolas,"Microsoft YaHei",monospace}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
<path d="M0 0L8 4L0 8" fill="#5b7297"/>
</marker>
</defs>
<rect width="680" height="550" rx="22" fill="#f5f8fd"/>
<text x="28" y="45" class="title" text-anchor="start">补齐缺口，后面的字节才能交给应用</text>
<text x="28" y="94" class="strong" text-anchor="start">接收端现在有什么？</text>
<rect x="28" y="126" width="190" height="80" rx="5" fill="#bce5d5"/>
<rect x="245" y="126" width="190" height="80" rx="5" fill="#ffe1b2"/>
<rect x="462" y="126" width="190" height="80" rx="5" fill="#c6dbff"/>
<text x="123" y="155" class="mono" text-anchor="middle">1001–2000</text>
<text x="123" y="188" class="small" text-anchor="middle">已连续收到</text>
<text x="340" y="155" class="mono" text-anchor="middle">2001–3000</text>
<text x="340" y="188" class="strong" text-anchor="middle">缺口</text>
<text x="557" y="155" class="mono" text-anchor="middle">3001–4000</text>
<text x="557" y="188" class="small" text-anchor="middle">先到，可暂存</text>
<path d="M123 207 L123 248" fill="none" stroke="#5b7297" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="28" y="279" class="small" text-anchor="start">可按序交付</text>
<text x="340" y="249" class="strong" text-anchor="middle">ACK = 2001</text>
<text x="340" y="279" class="small" text-anchor="middle">下一期望字节</text>
<path d="M557 210v76H445" fill="none" stroke="#5b7297" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="28" y="320" width="624" height="67" rx="12" fill="#fff"/>
<text x="340" y="361" class="strong" text-anchor="middle">发送端检测丢失 → 重传 2001–3000</text>
<path d="M340 388 L340 425" fill="none" stroke="#5b7297" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="28" y="430" width="624" height="65" rx="12" fill="#bce5d5"/>
<text x="340" y="471" class="strong" text-anchor="middle">1001 … 4000 连续 → ACK = 4001</text>
<text x="340" y="531" class="small" text-anchor="middle">后段不越过缺口交付；一个重复 ACK 不等于立即重传</text>
</svg>
