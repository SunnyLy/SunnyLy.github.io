<svg xmlns="http://www.w3.org/2000/svg" width="620" height="720" viewBox="0 0 620 720" role="img" aria-labelledby="title desc">
<title id="title">HMAC与签名由谁生成、由谁验证</title><desc id="desc">共享密钥的双方都能生成HMAC；数字签名的私钥留发布者，验证者用可信公钥验证消息和签名。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="720" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">谁有能力生成一份合法认证值？</tspan></text><text x="28" y="100" class="heading" text-anchor="start"><tspan x="28" dy="0">HMAC：同一把秘密 K</tspan></text><rect x="28" y="124" width="238" height="94" rx="14" class="blue"/><text x="147" y="164.5" class="body" text-anchor="middle"><tspan x="147" dy="0">发送方持有 K</tspan><tspan x="147" dy="29">可生成 MAC</tspan></text><rect x="354" y="124" width="238" height="94" rx="14" class="blue"/><text x="473" y="164.5" class="body" text-anchor="middle"><tspan x="473" dy="0">接收方也持有 K</tspan><tspan x="473" dy="29">也可生成 MAC</tspan></text><path d="M266 169 L354 169" class="arrow" marker-end="url(#a)"/><rect x="108" y="260" width="404" height="66" rx="14" class="teal"/><text x="310" y="301" class="body" text-anchor="middle"><tspan x="310" dy="0">接收：用 K 重算，再比较标签</tspan></text><path d="M473 218 V240 H310 V260" class="arrow" marker-end="url(#a)"/><text x="28" y="363" class="small" text-anchor="start"><tspan x="28" dy="0">因此：只能确认“某个持 K 者”，不能区分双方。</tspan></text><text x="28" y="428" class="heading" text-anchor="start"><tspan x="28" dy="0">数字签名：私钥与公钥分工</tspan></text><rect x="28" y="452" width="238" height="94" rx="14" class="blue"/><text x="147" y="492.5" class="body" text-anchor="middle"><tspan x="147" dy="0">发布方：秘密私钥</tspan><tspan x="147" dy="29">消息 → 签名</tspan></text><rect x="354" y="452" width="238" height="94" rx="14" class="teal"/><text x="473" y="492.5" class="body" text-anchor="middle"><tspan x="473" dy="0">验证方：可信公钥</tspan><tspan x="473" dy="29">消息 + 签名 → 验证</tspan></text><path d="M266 499 L354 499" class="arrow" marker-end="url(#a)"/><text x="28" y="586" class="small" text-anchor="start"><tspan x="28" dy="0">跨网络的是消息与签名，私钥不发送。</tspan></text><text x="28" y="624" class="small" text-anchor="start"><tspan x="28" dy="0">公钥要先可信：证书、预置或受验证的分发渠道。</tspan></text><text x="28" y="662" class="small" text-anchor="start"><tspan x="28" dy="0">验签不是“公钥解密”；签名也不会隐藏消息。</tspan></text>
</svg>
