<svg xmlns="http://www.w3.org/2000/svg" width="620" height="800" viewBox="0 0 620 800" role="img" aria-labelledby="title desc">
<title id="title">AEAD保护的数据与验证关口</title><desc id="desc">发送方将本机密钥、明文、nonce和AAD输入AEAD，网络上传输由协议规定的公开材料、密文和标签，接收方验证失败拒绝，成功才交付明文。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="800" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">AEAD：内容隐藏，公开头也不能随意改</tspan></text><rect x="28" y="70" width="564" height="88" rx="14" class="blue"/><text x="310" y="107.5" class="body" text-anchor="middle"><tspan x="310" dy="0">发送方本机：秘密 K + 明文</tspan><tspan x="310" dy="29">另有 nonce 与 AAD</tspan></text><path d="M310 158 L310 200" class="arrow" marker-end="url(#a)"/><rect x="150" y="200" width="320" height="60" rx="14" class="blue"/><text x="310" y="238" class="body" text-anchor="middle"><tspan x="310" dy="0">AEAD 加密</tspan></text><path d="M310 260 L310 308" class="arrow" marker-end="url(#a)"/><text x="28" y="296" class="small" text-anchor="start"><tspan x="28" dy="0">线路上的逻辑材料（格式由协议定义）</tspan></text><rect x="28" y="315" width="175" height="82" rx="14" class="orange"/><text x="115.5" y="349.5" class="body" text-anchor="middle"><tspan x="115.5" dy="0">AAD</tspan><tspan x="115.5" dy="29">只认证</tspan></text><rect x="215" y="315" width="165" height="82" rx="14" class="neutral"/><text x="297.5" y="349.5" class="body" text-anchor="middle"><tspan x="297.5" dy="0">nonce</tspan><tspan x="297.5" dy="29">通常公开</tspan></text><rect x="392" y="315" width="200" height="82" rx="14" class="teal"/><text x="492" y="349.5" class="body" text-anchor="middle"><tspan x="492" dy="0">密文 + tag</tspan><tspan x="492" dy="29">内容受保护</tspan></text><text x="28" y="434" class="small" text-anchor="start"><tspan x="28" dy="0">AAD / nonce 可以隐式构造，并非都逐字段发送。</tspan></text><path d="M310 397 V470" class="arrow" marker-end="url(#a)"/><rect x="100" y="470" width="420" height="88" rx="14" class="blue"/><text x="310" y="507.5" class="body" text-anchor="middle"><tspan x="310" dy="0">接收方本机：对应秘密 K</tspan><tspan x="310" dy="29">验证并解密</tspan></text><path d="M220 558 V603 H160 V628" class="arrow" marker-end="url(#a)"/><path d="M400 558 V603 H460 V628" class="arrow" marker-end="url(#a)"/><text x="160" y="593" class="small" text-anchor="middle"><tspan x="160" dy="0">认证失败</tspan></text><text x="460" y="593" class="small" text-anchor="middle"><tspan x="460" dy="0">认证成功</tspan></text><rect x="28" y="628" width="264" height="66" rx="14" class="red"/><text x="160" y="669" class="body" text-anchor="middle"><tspan x="160" dy="0">拒绝，不交付明文</tspan></text><rect x="336" y="628" width="256" height="66" rx="14" class="teal"/><text x="464" y="669" class="body" text-anchor="middle"><tspan x="464" dy="0">才交给业务处理</tspan></text><text x="28" y="741" class="small" text-anchor="start"><tspan x="28" dy="0">同一 K 下 nonce 按算法要求保持唯一。</tspan></text><text x="28" y="776" class="small" text-anchor="start"><tspan x="28" dy="0">改动受认证材料，或密钥不匹配，会使验证失败。</tspan></text>
</svg>
