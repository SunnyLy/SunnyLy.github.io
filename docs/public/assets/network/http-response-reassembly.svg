<svg xmlns="http://www.w3.org/2000/svg" width="620" height="800" viewBox="0 0 620 800" role="img" aria-labelledby="title desc">
<title id="title">HTTP2帧怎样还原两个响应</title><desc id="desc">服务端对GET图片A和样式B的响应在HTTP2流1和3交错发送HEADERS和DATA，客户端按StreamID分别拼出消息体；没有把GET画成有图片请求体。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="800" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">服务端发出的帧：每块都带所属流编号</tspan></text><rect x="28" y="70" width="564" height="65" rx="14" class="neutral"/><text x="310" y="110.5" class="body" text-anchor="middle"><tspan x="310" dy="0">GET 图片 A 用流 1；GET 样式 B 用流 3</tspan></text><rect x="28" y="173" width="267" height="70" rx="14" class="blue"/><text x="161.5" y="216" class="body" text-anchor="middle"><tspan x="161.5" dy="0">HEADERS · 流 1</tspan></text><rect x="325" y="173" width="267" height="70" rx="14" class="teal"/><text x="458.5" y="216" class="body" text-anchor="middle"><tspan x="458.5" dy="0">HEADERS · 流 3</tspan></text><rect x="28" y="274" width="176" height="70" rx="14" class="blue"/><text x="116" y="317" class="body" text-anchor="middle"><tspan x="116" dy="0">DATA · 1 · A₁</tspan></text><rect x="222" y="274" width="176" height="70" rx="14" class="teal"/><text x="310" y="317" class="body" text-anchor="middle"><tspan x="310" dy="0">DATA · 3 · B₁</tspan></text><rect x="416" y="274" width="176" height="70" rx="14" class="blue"/><text x="504" y="317" class="body" text-anchor="middle"><tspan x="504" dy="0">DATA · 1 · A₂</tspan></text><text x="310" y="386" class="body" text-anchor="middle"><tspan x="310" dy="0">同一连接：帧按示意顺序传输 →</tspan></text><path d="M310 410 L310 460" class="arrow" marker-end="url(#a)"/><rect x="130" y="460" width="360" height="65" rx="14" class="neutral"/><text x="310" y="500.5" class="body" text-anchor="middle"><tspan x="310" dy="0">客户端按 Stream ID 分流</tspan></text><path d="M220 525 V571 H166 V609" class="arrow" marker-end="url(#a)"/><path d="M400 525 V571 H455 V609" class="arrow" marker-end="url(#a)"/><rect x="28" y="609" width="276" height="92" rx="14" class="blue"/><text x="166" y="648.5" class="small" text-anchor="middle"><tspan x="166" dy="0">流 1：响应头 + A₁ + A₂</tspan><tspan x="166" dy="29">还原图片 A</tspan></text><rect x="330" y="609" width="262" height="92" rx="14" class="teal"/><text x="461" y="648.5" class="small" text-anchor="middle"><tspan x="461" dy="0">流 3：响应头 + B₁</tspan><tspan x="461" dy="29">还原样式 B</tspan></text><text x="28" y="744" class="small" text-anchor="start"><tspan x="28" dy="0">本图只画响应；每个流内仍要遵守 HEADERS / DATA 顺序。</tspan></text><text x="28" y="777" class="small" text-anchor="start"><tspan x="28" dy="0">DATA 是 Body 片段；头部过长还可使用 CONTINUATION。</tspan></text>
</svg>
