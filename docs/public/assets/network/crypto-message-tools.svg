<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820" role="img" aria-labelledby="title desc">
<title id="title">同一条消息，三种处理</title><desc id="desc">amount=100先编码、摘要或消息认证，各路径写明接收方材料；编码和摘要无秘密，HMAC需要共享密钥。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="820" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">同一条消息：amount=100</tspan></text><rect x="28" y="65" width="564" height="64" rx="14" class="neutral"/><text x="310" y="105" class="body" text-anchor="middle"><tspan x="310" dy="0">先问：要隐藏内容，还是发现改动？</tspan></text><text x="28" y="178" class="heading" text-anchor="start"><tspan x="28" dy="0">① Base64：换一种写法</tspan></text><rect x="28" y="200" width="218" height="82" rx="14" class="blue"/><text x="137" y="249" class="body" text-anchor="middle"><tspan x="137" dy="0">amount=100</tspan></text><path d="M246 241 L365 241" class="arrow" marker-end="url(#a)"/><text x="305" y="222" class="small" text-anchor="middle"><tspan x="305" dy="0">编码</tspan></text><rect x="365" y="200" width="227" height="82" rx="14" class="neutral"/><text x="478.5" y="249" class="small" text-anchor="middle"><tspan x="478.5" dy="0">YW1vdW50PTEwMA==</tspan></text><text x="28" y="315" class="small" text-anchor="start"><tspan x="28" dy="0">接收方：直接解码。任何人都能还原。</tspan></text><text x="28" y="375" class="heading" text-anchor="start"><tspan x="28" dy="0">② SHA-256：算一个内容指纹</tspan></text><rect x="28" y="397" width="218" height="82" rx="14" class="blue"/><text x="137" y="446" class="body" text-anchor="middle"><tspan x="137" dy="0">amount=100</tspan></text><path d="M246 438 L365 438" class="arrow" marker-end="url(#a)"/><text x="305" y="419" class="small" text-anchor="middle"><tspan x="305" dy="0">摘要</tspan></text><rect x="365" y="397" width="227" height="82" rx="14" class="neutral"/><text x="478.5" y="446" class="body" text-anchor="middle"><tspan x="478.5" dy="0">固定长度摘要</tspan></text><text x="28" y="512" class="small" text-anchor="start"><tspan x="28" dy="0">接收方：与可信的预期摘要比较。没有秘密。</tspan></text><text x="28" y="572" class="heading" text-anchor="start"><tspan x="28" dy="0">③ HMAC：只有持密钥者才能生成</tspan></text><rect x="28" y="594" width="218" height="92" rx="14" class="blue"/><text x="137" y="648" class="body" text-anchor="middle"><tspan x="137" dy="0">消息 + 秘密 K</tspan></text><path d="M246 640 L365 640" class="arrow" marker-end="url(#a)"/><text x="305" y="620" class="small" text-anchor="middle"><tspan x="305" dy="0">MAC</tspan></text><rect x="365" y="594" width="227" height="92" rx="14" class="teal"/><text x="478.5" y="648" class="body" text-anchor="middle"><tspan x="478.5" dy="0">消息 + 标签</tspan></text><text x="28" y="720" class="small" text-anchor="start"><tspan x="28" dy="0">接收方：用同一 K 重算标签，再比较。</tspan></text><text x="28" y="754" class="small" text-anchor="start"><tspan x="28" dy="0">HMAC 不隐藏消息；共享 K 的双方都能生成标签。</tspan></text><text x="28" y="789" class="small" text-anchor="start"><tspan x="28" dy="0">图中文字是教学输入，不是真实支付系统。</tspan></text>
</svg>
