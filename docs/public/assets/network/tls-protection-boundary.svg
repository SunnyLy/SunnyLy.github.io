<svg xmlns="http://www.w3.org/2000/svg" width="620" height="610" viewBox="0 0 620 610" role="img" aria-labelledby="title desc">
<title id="title">TLS保护到终止点，后端是第二条连接</title><desc id="desc">浏览器到TLS终止代理通过连接一加密，代理解密；代理到应用是独立连接二，需要单独配置HTTPS保护。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53677f"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1e334d}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#475d76}.blue{fill:#eef5ff;stroke:#a8c7ef;stroke-width:1.5}.teal{fill:#edf9f5;stroke:#94d0bb;stroke-width:1.5}.orange{fill:#fff5e9;stroke:#e6bd82;stroke-width:1.5}.neutral{fill:#f4f6f9;stroke:#c8d1de;stroke-width:1.5}.red{fill:#fff0f0;stroke:#dca3a3;stroke-width:1.5}.arrow{fill:none;stroke:#53677f;stroke-width:2}.dash{fill:none;stroke:#53677f;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="620" height="610" rx="18" fill="#fff"/>
<text x="28" y="40" class="heading" text-anchor="start"><tspan x="28" dy="0">点开笔记站：哪一段是密文？</tspan></text><rect x="90" y="75" width="440" height="76" rx="14" class="blue"/><text x="310" y="121" class="body" text-anchor="middle"><tspan x="310" dy="0">浏览器：生成 HTTP 明文</tspan></text><path d="M310 151 L310 247" class="arrow" marker-end="url(#a)"/><text x="330" y="190" class="body" text-anchor="start"><tspan x="330" dy="0">连接① HTTPS</tspan><tspan x="330" dy="29">网络上传输密文</tspan></text><rect x="90" y="247" width="440" height="102" rx="14" class="teal"/><text x="310" y="291.5" class="body" text-anchor="middle"><tspan x="310" dy="0">站点入口 / CDN / 反向代理</tspan><tspan x="310" dy="29">TLS 在此终止，可读 HTTP 明文</tspan></text><path d="M310 349 L310 446" class="arrow" marker-end="url(#a)"/><text x="330" y="386" class="body" text-anchor="start"><tspan x="330" dy="0">连接② 独立配置</tspan><tspan x="330" dy="29">HTTP 或另建 HTTPS</tspan></text><rect x="90" y="446" width="440" height="76" rx="14" class="blue"/><text x="310" y="492" class="body" text-anchor="middle"><tspan x="310" dy="0">应用：读取请求，执行业务</tspan></text><text x="28" y="562" class="small" text-anchor="start"><tspan x="28" dy="0">①受保护，不会自动让②也加密。</tspan></text><text x="28" y="595" class="small" text-anchor="start"><tspan x="28" dy="0">路径设备仍可观察部分地址、时间与流量大小。</tspan></text>
</svg>
